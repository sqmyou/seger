name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the engine
        run: make

      - name: Run the test suites
        run: make test

      - name: Smoke-test the UCI loop
        run: |
          printf 'uci\nposition startpos\ngo depth 4\nquit\n' \
            | ./build/seger | grep -q 'bestmove'

      - name: Benchmark (node-count signature)
        run: make bench
